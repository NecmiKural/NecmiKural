name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly; GitHub pauses it after 60 days without repo activity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest # Python 3.12; tomllib is in the standard library
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/portfolio.py selftest
      - run: python3 scripts/portfolio.py check --online
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
