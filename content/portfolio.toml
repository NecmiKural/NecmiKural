[[project]]
id = "mcp-code-mode"
title = "mcp-code-mode"
repo = "NecmiKural/mcp-code-mode"
ref = "v0.1.0"
release = true
group = "flagship"
status = "show"
label = "MCP"
short = "Code mode for any MCP server, in Python"
pitch = "Run model-written Python against any MCP server's tools in a locked-down Docker sandbox, through a host-side bridge that checks every call."
card = "Run model-written Python against any MCP server's tools in a locked-down Docker sandbox. It serves a wrapped server's tools to the model as one run_python tool. Every call passes a host-side bridge that checks the allowlist, the tool's JSON Schema, argument size and a call budget, and refuses oversized results. Extracted from bank-reconciliation-agent; the README maps each threat to a control and a test, and lists what it does not protect."
stack = ["Python", "MCP", "Docker"]
results = "README.md#threat-model"
visual = { src = "docs/demo.svg", ref = "0c2e9e84d1451f539927dae2c334266710a27923", alt = "Terminal capture: a program calls two allowlisted toy tools through the bridge, then builds a call to a tool off the allowlist, which the bridge refuses before the server sees it" }

  [[project.claim]]
  lead = "Where it was measured, in bank-reconciliation-agent:"
  text = '''containment held in every run and every probe, and code mode was cheaper on average, but the pre-registered efficiency hypothesis failed for both models tested. Read the numbers there; this package carries no measurements of its own.'''

