[[project]]
id = "birdclef-2026-audio-classification"
title = "birdclef-2026-audio-classification"
repo = "NecmiKural/birdclef-2026-audio-classification"
ref = "d6540d14b8524af137806dcefdde460a79e9256f"
group = "coursework"
status = "show"
course = "Deep Learning (COMPX525)"
short = "Synthetic clips for rare bird classes, tested"
card = "Tests whether AudioLDM2 synthetic clips for rare classes help two classifiers: BirdNET embeddings with a linear classifier, and a CNN trained from scratch on mel-spectrograms. The clips helped the first and hurt the second."
stack = ["Python", "PyTorch", "BirdNET", "AudioLDM2", "scikit-learn"]
visual = [
  { src = "figures/spec_sptnig1.png", ref = "d6540d14b8524af137806dcefdde460a79e9256f", alt = "Two mel spectrograms of five seconds each: a real Spot-tailed Nightjar recording, with repeated arcs of song over background noise, and an AudioLDM2 synthetic clip made of flat horizontal bands. The title gives the class's validation ROC-AUC as 0.172 without synthetic clips and 0.971 with them", caption = "Mel spectrograms derived from BirdCLEF+ 2026 competition audio: a real Spot-tailed Nightjar clip and an AudioLDM2 one. For this rare class, synthetic clips lifted the CNN's AUC from 0.172 to 0.971." },
  { src = "figures/fig_experiment_flow.png", ref = "d6540d14b8524af137806dcefdde460a79e9256f", alt = "Flow chart of the experiments: the training list is split into real training and validation sets; rare classes get synthetic clips from AudioLDM2; four models, BirdNET embeddings with a linear classifier and a compact CNN on mel spectrograms, each with and without the synthetic clips, are scored on one shared validation set by macro ROC-AUC", caption = "The experiment design. The audio is BirdCLEF+ 2026 competition data; the synthetic clips were generated for the rare classes." },
]
extra = [{ label = "Kaggle notebook", url = "https://www.kaggle.com/code/necmikural/birdclef-2026-synthetic-enrichment-summary" }]

  [[project.claim]]
  text = '''BirdNET embeddings + ML reach 0.8940 validation macro ROC-AUC with synthetic enrichment and 0.8869 without, on one fixed 80/20 split of train_audio with one seed. This is not a Kaggle leaderboard score.'''

