[[project]]
id = "bank-reconciliation-agent"
title = "Bank Reconciliation Agent"
repo = "NecmiKural/bank-reconciliation-agent"
ref = "v1.1.0"
release = true
group = "flagship"
status = "show"
label = "RECON"
short = "Rules-first reconciliation agent on synthetic data"
pitch = "A rules-first tool-calling agent that matches small-business bank lines to invoices on synthetic data."
card = "A rules-first tool-calling agent that matches small-business bank lines to invoices on synthetic data. Code verifies every proposal, the model cannot write to the ledger, and a person approves before anything posts. Read-only MCP server, a plain-English rule compiler, live evals on four models, a pre-registered code-mode experiment and a CI replay gate; the README says where it breaks."
stack = ["Python", "PostgreSQL", "pgvector", "MCP", "Docker"]
synthetic_data = true
results = "README.md"
visual = { src = "docs/demo.svg", alt = "Terminal replay of make demo: 40 committed bank lines through the rules pass, the agent and the shadow policy, each proposal left for a person to review" }
extra = [{ label = "Code-mode experiment", url = "docs/code-mode-experiment.md" }]

  [[project.claim]]
  lead = "With deepseek-flash:"
  text = '''0 wrong matches in 460 agent match proposals (582 agent decisions) over 3 live runs on each of two synthetic businesses.'''

  [[project.claim]]
  text = '''0 of 40 injected lines that ask for a different or an extra invoice succeeded in any run. The verifier refuses whatever the payload asks for on 36 of them; on the 4 it leaves to the model's judgement, 0 payloads were followed by any model in any run with defences on.'''

  [[project.claim]]
  lead = "Pre-registered code-mode experiment:"
  text = '''containment held in every run and every probe, and code mode was cheaper on average, but the pre-registered efficiency hypothesis failed for both models tested.'''
  repo = "NecmiKural/mcp-code-mode"
  ref = "v0.1.0"

