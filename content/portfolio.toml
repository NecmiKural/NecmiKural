ref = "37a98018057b92bb848b9f70fdc6986e2745eda5"
group = "coursework"
status = "show"
course = "Machine Learning for Data Streams (COMPX523)"
short = "Online ensemble under a 250 KB memory budget"
card = "An online ensemble classifier for a drifting, imbalanced stream under a hard 250 KB memory budget, with a post-mortem of the memory-measurement bugs that put the submitted version over the limit, and a re-run with the cap enforced."
stack = ["Python", "CapyMOA", "MOA"]
visual = { src = "figures/tournament_score.png", ref = "006a597d176c00e83bae45eda6992fc0ca68cb3b", alt = "Horizontal bar chart of tournament scores on the synthetic stream: Naive Bayes 0.609, the spec ensemble 0.841, the champion as submitted 0.964 with its trees never capped and over the memory limit, and the fixed champion 0.905 at 234 KB, under the 250 KB budget", caption = "The submitted champion scored higher only because its trees were never capped; the fixed one stays under the 250 KB budget." }

  [[project.claim]]
  lead = "After the fix:"
  text = '''On the synthetic RBF stream (100,000 instances, 4 drifts) with MOA's size agent loaded, the fixed champion (n=25, 8 KB per tree, memory_estimate_period=1000) reaches a tournament score of 0.9048, with its trees measured at 204.8 KB on the Java side and about 234 KB in total, under the 250 KB budget.'''

  [[project.claim]]
  text = '''Builds an online ensemble classifier that learns continuously from a non-stationary stream with class imbalance and concept drift, under a hard 250 KB memory budget.'''

